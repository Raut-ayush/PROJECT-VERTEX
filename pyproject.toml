[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-vertex"
version = "0.1.0"
description = "Headless educational 2D planar rigid-body simulation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["gymnasium>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
rl = ["stable-baselines3>=2.9,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

